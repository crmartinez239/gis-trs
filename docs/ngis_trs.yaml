openapi: 3.1.0
info:
  title: NTS GIS Token Refresh Server
  description: NTS GIS Token Refresh Server
  version: 1.0.0
servers:
  - url: 'http://localhost:3000'
paths:
  /auth/token/{user_id}:
    get:
      summary: Get token by user ID
      description: Retrieves the stored token for the specified user.
      parameters:
        - in: path
          name: user_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User token found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        "404":
          description: User token not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    Token:
      type: object
      properties:
        access_token:
          type: string
          description: User's current access token
    Error:
      type: object
      properties:
        message:
          type: string
          description: Error message